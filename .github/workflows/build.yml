name: build

# The previous version of this workflow went green while producing nothing:
# run 34007945982 reported success for both jobs and uploaded zero artifacts,
# because the upload globs did not match where flet actually wrote the builds
# and `if-no-files-found` defaulted to a warning. Two changes stop that from
# recurring:
#   * every build passes an explicit `-o dist/<target>`, so the output path is
#     decided here rather than inferred from flet's internals
#   * every upload uses `if-no-files-found: error`, so an empty artifact fails
#     the run instead of quietly shipping nothing
# A "list what was produced" step runs before each upload so that if a path
# ever does drift, the log says exactly where the files went.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one build per ref at a time. Three overlapping runs competed for the
# same runners and two died part-way through the Linux step.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # flet 0.86.5 requires this exact Flutter version; bump both together.
  FLUTTER_VERSION: "3.44.8"
  PYTHON_VERSION: "3.12"
  FLET_VERSION: "0.86.5"

jobs:
  linux-android-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      # Pinned, not bare `pip install flet`: the app is written against the
      # 0.86 API (ft.run, SharedPreferences as a service) and an unpinned
      # install would silently move to a version that removed them.
      # flet-cli provides the `flet build` command and is deliberately NOT in
      # requirements.txt, which flet uses to decide what to bundle into the app.
      - name: Install flet
        run: pip install "flet==${FLET_VERSION}" "flet-cli==${FLET_VERSION}"

      # Required to build Flutter Linux desktop targets.
      # Source: docs.flutter.dev platform-integration/linux/setup
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev

      # assets/maps carries ~117 MB (offline tiles + routing graph) and every
      # target embeds a copy, on top of the Flutter and Android SDKs. Report
      # space at each stage so an out-of-disk failure is obvious rather than
      # showing up as a step that simply stops.
      - name: Free disk space and report
        run: |
          df -h / | tail -1
          for d in /usr/share/dotnet /opt/ghc /usr/share/swift \
                   /usr/local/share/powershell /usr/local/lib/android/sdk/ndk; do
            sudo rm -rf "$d" || true
          done
          echo 'after cleanup:'; df -h / | tail -1
          echo 'repo assets:'; du -sh assets/maps 2>/dev/null || echo '  none'

      # --exclude keeps the build output and the git history OUT of the
      # bundle. Inspecting the 402 MB AppImage found the whole .git
      # directory inside it (48 MB and 28 MB pack objects) plus a
      # complete 295 MB copy of the APK under dist/. Shipping .git
      # inside a distributed application hands over the entire
      # history of a private repo.
      - name: Build Android APK
        run: flet build apk --yes -o dist/apk --exclude .git dist build .venv

      - name: Disk after APK
        run: df -h / | tail -1

      - name: Build Linux x64
        run: flet build linux --yes -o dist/linux --exclude .git dist build .venv

      - name: Disk after Linux
        run: df -h / | tail -1

      # Also produces the PWA. This is the only free route onto an iPhone:
      # installing a real iOS build needs an Apple Developer Program account,
      # so "Add to Home Screen" from this build is the no-cost path.
      # The web target is excluded from the offline map and routing graph.
      # Baking 117 MB into a Pyodide web bundle killed the runner (exit 143,
      # OOM, seven minutes after splash generation) and took the AppImage
      # down with it. A browser build should not ship a 78 MB routing graph
      # as a download anyway - on the web the app talks to the server.
      # continue-on-error so a web failure can never again block the five
      # artifacts that matter on a phone or a laptop.
      - name: Build web (PWA)
        continue-on-error: true
        run: flet build web --yes -o dist/web --exclude assets/maps .git dist build .venv

      # flet build linux emits a folder (binary + lib/ + data/ + site-packages),
      # not a single runnable file. AppImage wraps that folder into one
      # double-clickable executable, which is what people actually expect a
      # Linux download to be.
      - name: Package Linux build as an AppImage
        run: |
          set -eu
          APP=NVII-DASH
          # The launcher is the one ELF executable at the top of the build.
          BIN="$(find dist/linux -maxdepth 1 -type f -executable \
                 -exec sh -c 'file -b "$1" | grep -q ELF' _ {} \; -print | head -1)"
          if [ -z "$BIN" ]; then
            echo "no executable found at the top of dist/linux:" >&2
            ls -la dist/linux >&2
            exit 1
          fi
          echo "launcher: $BIN"
          rm -rf AppDir && mkdir -p AppDir/usr/bin
          cp -r dist/linux/. AppDir/usr/bin/
          BINNAME="$(basename "$BIN")"
          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          # Resolve the real directory even when invoked through a symlink,
          # so the bundled libs and python runtime are found.
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          export LD_LIBRARY_PATH="\$HERE/usr/bin/lib:\${LD_LIBRARY_PATH:-}"
          exec "\$HERE/usr/bin/$BINNAME" "\$@"
          EOF
          chmod +x AppDir/AppRun
          cat > AppDir/$APP.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=$APP
          Comment=Dashbored companion
          Exec=$BINNAME
          Icon=$APP
          Categories=Utility;
          Terminal=false
          EOF
          # An icon is mandatory. Use the app's own if the build produced one,
          # otherwise a 1x1 placeholder so packaging cannot fail on artwork.
          ICON="$(find dist/linux -name '*.png' | head -1)"
          if [ -n "$ICON" ]; then cp "$ICON" AppDir/$APP.png
          else printf '\211PNG\r\n\032\n' > AppDir/$APP.png; fi
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p dist/appimage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            AppDir "dist/appimage/$APP-x86_64.AppImage"
          ls -la dist/appimage

      - name: List build output
        run: |
          echo "--- tree ---"; find dist -maxdepth 3 | head -60
          echo "--- sizes ---"; du -sh dist/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: nvii-dash-android-apk
          path: dist/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nvii-dash-linux-x64
          path: dist/linux/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: hashFiles('dist/web/**') != ''
        with:
          name: nvii-dash-web-pwa
          path: dist/web/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nvii-dash-linux-appimage
          path: dist/appimage/*.AppImage
          if-no-files-found: error

  macos-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install flet
        run: pip install "flet==${FLET_VERSION}" "flet-cli==${FLET_VERSION}"

      - name: Build macOS app
        run: flet build macos --yes -o dist/macos --exclude .git dist build .venv

      # Unsigned iOS build for sideloading. With no provisioning profile
      # configured, flet passes --no-codesign through to flutter
      # (flet_cli/commands/build.py), which is exactly what AltStore /
      # Sideloadly want: they re-sign with a free Apple ID on the way in. No
      # paid Developer Program account involved.
      - name: Build iOS (unsigned, for sideloading)
        run: flet build ipa --yes -o dist/ipa --exclude .git dist build .venv

      # flutter build ipa --no-codesign often stops at the .app/.xcarchive and
      # never emits a .ipa, because packaging is normally the signing step's
      # job. Sideloaders want a .ipa, which is just a zip with the app inside
      # Payload/ - so build one if it is missing.
      - name: Package .ipa if the unsigned build only produced an .app
        run: |
          set -eu
          if find dist/ipa -name '*.ipa' | grep -q .; then
            echo "flet already produced an .ipa, nothing to do"
            exit 0
          fi
          app="$(find dist/ipa -maxdepth 4 -name 'Runner.app' -o -maxdepth 4 -name '*.app' | head -1)"
          if [ -z "$app" ]; then
            echo "no .app found under dist/ipa - listing what is there:" >&2
            find dist/ipa | head -40 >&2
            exit 1
          fi
          echo "packaging $app"
          staging="$(mktemp -d)"
          mkdir -p "$staging/Payload"
          cp -R "$app" "$staging/Payload/"
          (cd "$staging" && zip -qry nvii-dash-unsigned.ipa Payload)
          mv "$staging/nvii-dash-unsigned.ipa" dist/ipa/

      - name: List build output
        run: |
          echo "--- tree ---"; find dist -maxdepth 3 | head -60
          echo "--- sizes ---"; du -sh dist/* || true

      - uses: actions/upload-artifact@v4
        with:
          name: nvii-dash-macos
          path: dist/macos/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: nvii-dash-ios-unsigned-ipa
          path: dist/ipa/**/*.ipa
          if-no-files-found: error
