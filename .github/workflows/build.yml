name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Install flet
        run: pip install flet
      - name: Build APK
        run: flet build apk --yes
      - name: Build Linux
        if: false  # X11/GBK deps on runner need extra pkgs; enable when needed
        run: flet build linux
      - uses: actions/upload-artifact@v4
        with:
          name: nvii-dash-android
          path: build/apk/outputs/apk/*/*.apk

  macos-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
      - name: Install flet
        run: pip install flet
      - name: Build macOS app
        run: flet build macos --yes
      - name: Build iOS simulator app (unsigned)
        run: flet build ios-simulator --yes
      - uses: actions/upload-artifact@v4
        with:
          name: nvii-dash-macos
          path: build/macos/Build/Products/Release/*.app
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: nvii-dash-ios-simulator
          path: build/ios_simulator/**/*.app
          if-no-files-found: warn
