# Agedashii Watudo - Wat2Do and Future Finds, as an app of their own.
#
# Two halves. The [project] block is what pip installs, so the pages can be
# imported by the dashboard as well as by this app's own main.py. The
# [tool.flet] blocks below are what `flet build` reads to write
# AndroidManifest.xml, Info.plist, the .desktop entry and the macOS product -
# none of which flet invents correctly on its own. Left out, it derives the
# product name and the bundle id from whatever the directory happens to be
# called, which is how an old name survives a rename of everything else.
#
# The dependency list below is also the one `flet build` installs into the
# bundle. That is not obvious and is worth writing down: flet reads the TOML
# list when it is non-empty and only falls back to requirements.txt when it
# is empty (flet_cli/commands/build_base.py, `_install_python_packages`).
# The repo-root pyproject.toml declares none, which is why the root build
# reads the root requirements.txt. This file has a list, so this list is
# what ships - and anything missing from it is missing from the app.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agedashii-watudo"
version = "1.0.0"
description = "Agedashii Watudo - what to do today, and where to go someday"
requires-python = ">=3.12"
dependencies = [
    "flet>=0.86,<0.87",
    # Wat2Do's Present tab draws a map: home, the scanned spots, and the
    # route to the one the mission picked. It is imported behind a
    # try/except (pages/wat2do.py, MAPS_AVAILABLE), so leaving it out does
    # not fail the build - it ships an app whose map card is simply absent
    # and whose "route to here" has nowhere to draw. Pinned to the same
    # 0.86.x as flet itself, because a plugin from a different minor talks
    # to a Flutter side that is not there.
    "flet-map>=0.86,<0.87",
    "agedashii-washi==1.0.0",
    # Named as well as agedashii-washi, which already requires it, so that
    # the dev_packages table below can point it at this checkout too. Left
    # implicit, pip would go looking for it on PyPI, where it is not.
    "agedashii-qi==1.0.0",
    # flet-geolocator is deliberately absent: nothing in this app asks the
    # device where it is. See the permission block below, which says what
    # that means for the manifest.
]

[tool.setuptools.packages.find]
include = ["agedashii_watudo*"]

[tool.flet]
# Display name: window title, .desktop entry, macOS product, app launcher,
# and the label Android shows in the launcher and the multitasking view.
# Two words, because it is two things - the day planner and the someday
# list - and she names it "Agedashi-Watudo - What 2 DO".
product = "Agedashii Watudo"
org = "online.iamprettyfamous"
# Pinned rather than composed from org + project name, so the identity the
# OS installs under can never drift with a directory rename. This is the
# Android applicationId and the iOS/macOS bundle identifier.
#
# It sits *under* the dashboard's `online.iamprettyfamous.agedashii` rather
# than beside it: same family, distinct app. Distinct matters - each bundle
# id gets its own SharedPreferences store and its own app-private data
# directory, so this app keeps its own server address, its own layout and
# its own outbox, and installing it cannot disturb the dashboard's.
bundle_id = "online.iamprettyfamous.agedashii.watudo"
company = "nvii"
copyright = "Copyright (c) 2026 nvii"

# Qi and Washi are in this repo, not on PyPI, so a build would otherwise
# stop at `No matching distribution found for agedashii-washi`. flet turns
# each entry here into `name @ file:///abs/path` before handing the list to
# pip, resolving a relative path against this app's own directory - which
# is what makes the bundle carry the working copy of the shared packages
# rather than a published release that does not exist.
[tool.flet.dev_packages]
agedashii-qi = "../../packages/agedashii-qi"
agedashii-washi = "../../packages/agedashii-washi"

# Permissions. Without these the plugin is present, the code runs, and the
# feature fails at the point of use with a message about the manifest -
# which is exactly what XNAV did: "Record" produced "location permissions
# are not declared in the platform manifest". Declaring a plugin in
# requirements.txt does NOT declare its permissions; flet writes the
# manifest from these tables and nothing else.
#
# LOCATION, foreground only, is for what this app does with a place: Future
# Finds scans for gems around where she is, and Wat2Do routes to the one the
# mission picked. Both happen with the app open and on screen, in response
# to a tap; neither has any use for a position once she has put the phone
# away.
#
# Stated plainly, because a manifest that overstates is the thing that
# teaches an owner to ignore prompts: **no code in this app asks the device
# where it is today.** Every distance is measured from a fixed origin -
# `_wat2do_parts.HOME`, Vulcan Lofts - and `future.scan()` takes a `centre`
# that nothing currently passes. This is declared ahead of the feature
# rather than after it, which costs one line in the app's permission listing
# and nothing at runtime: Android only prompts when a permission is actually
# requested, and nothing here requests it yet. When the Scan button starts
# asking, the plugin goes in the dependency list above and this comment
# comes out.
[tool.flet.android.permission]
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true

# ACCESS_BACKGROUND_LOCATION and FOREGROUND_SERVICE_LOCATION are
# deliberately absent, and this is the note saying so rather than an
# oversight for someone to "fix" later.
#
# The dashboard declares both because XNAV records a ride: a track has to
# keep being written while the screen is off, and a foreground service is
# the only honest way to do that. Watudo records nothing. It asks "where am
# I" when she taps Scan, and it is done. Asking for background location
# anyway would mean the OS prompting her for all-the-time access, a Play
# listing that needs a written justification and a video, and a permission
# in the system settings that no code in this app would ever use - which is
# the kind of thing that makes a whole permission list untrustworthy.
#
# If a future Watudo ever wants to notice her arriving somewhere, that is
# the moment to add it, with the feature, in the same commit.

# Declared as NOT required so the Play listing and a sideload do not refuse
# a device that lacks GPS hardware. Without a fix the app degrades to
# network location, which for "what is within 25 miles of here" is plenty;
# refusing to install would be a much worse answer than a coarser one.
[tool.flet.android.feature]
"android.hardware.location.gps" = false
"android.hardware.location.network" = false

# iOS wants a sentence per permission, shown verbatim in the system prompt,
# and the App Store rejects a build that uses the API without one. It says
# what the location is for and stops there - there is no
# NSLocationAlwaysAndWhenInUseUsageDescription because there is no
# always-on use to describe.
[tool.flet.ios.info]
NSLocationWhenInUseUsageDescription = "Watudo uses your location to find places near you and to route to the one you pick."
